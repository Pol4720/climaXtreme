services:
  # ============================================================================
  # HDFS Cluster
  # ============================================================================
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: climaxtreme-namenode
    restart: unless-stopped
    ports:
      - "9870:9870"
      - "9000:9000"
    environment:
      - CLUSTER_NAME=climaxtreme
    env_file:
      - ./hadoop.env
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
    networks:
      - hdfs

  datanode1:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: climaxtreme-datanode1
    restart: unless-stopped
    depends_on:
      - namenode
    environment:
      - SERVICE_PRECONDITION=climaxtreme-namenode:9870
    env_file:
      - ./hadoop.env
    volumes:
      - hadoop_datanode1:/hadoop/dfs/data
    networks:
      - hdfs

  datanode2:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: climaxtreme-datanode2
    restart: unless-stopped
    depends_on:
      - namenode
    environment:
      - SERVICE_PRECONDITION=climaxtreme-namenode:9870
    env_file:
      - ./hadoop.env
    volumes:
      - hadoop_datanode2:/hadoop/dfs/data
    networks:
      - hdfs

  datanode3:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: climaxtreme-datanode3
    restart: unless-stopped
    depends_on:
      - namenode
    environment:
      - SERVICE_PRECONDITION=climaxtreme-namenode:9870
    env_file:
      - ./hadoop.env
    volumes:
      - hadoop_datanode3:/hadoop/dfs/data
    networks:
      - hdfs

  # ============================================================================
  # Kafka Cluster (Streaming Infrastructure)
  # ============================================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: climaxtreme-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    networks:
      - hdfs
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: climaxtreme-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: climaxtreme-zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://climaxtreme-kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_MESSAGE_MAX_BYTES: 10485760
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - hdfs
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10

  # Kafka UI for monitoring (optional but very useful)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: climaxtreme-kafka-ui
    restart: unless-stopped
    profiles:
      - monitoring
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: climaxtreme
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: climaxtreme-kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: climaxtreme-zookeeper:2181
    networks:
      - hdfs

  # ============================================================================
  # Processing Services
  # ============================================================================
  processor:
    build:
      context: ..
      dockerfile: infra/Dockerfile.processor
    container_name: climaxtreme-processor
    restart: unless-stopped
    depends_on:
      - namenode
      - datanode1
      - datanode2
      - datanode3
      - kafka
    environment:
      - HADOOP_CONF_DIR=/etc/hadoop
      - SPARK_HOME=/usr/local/lib/python3.11/site-packages/pyspark
      - PYSPARK_PYTHON=/usr/bin/python3
      - PYSPARK_DRIVER_PYTHON=/usr/bin/python3
      - KAFKA_BOOTSTRAP_SERVERS=climaxtreme-kafka:9092
    volumes:
      - ../Tools:/app/Tools
      - ../DATA:/app/DATA
      - synthetic_data:/app/DATA/synthetic
    networks:
      - hdfs
    ports:
      - "4040:4040"
    command: tail -f /dev/null

  dashboard:
    build:
      context: ..
      dockerfile: infra/Dockerfile.processor
    container_name: climaxtreme-dashboard
    restart: unless-stopped
    depends_on:
      - namenode
      - datanode1
      - kafka
    ports:
      - "8501:8501"
    environment:
      - HADOOP_CONF_DIR=/etc/hadoop
      - SYNTHETIC_DATA_PATH=/app/DATA/synthetic
      - KAFKA_BOOTSTRAP_SERVERS=climaxtreme-kafka:9092
    volumes:
      - ../Tools:/app/Tools
      - ../DATA:/app/DATA
      - synthetic_data:/app/DATA/synthetic
    networks:
      - hdfs
    working_dir: /app/Tools
    command: python3 -m climaxtreme.cli dashboard --host 0.0.0.0 --port 8501

  # Synthetic data generator service (optional - run on demand)
  synthetic-generator:
    build:
      context: ..
      dockerfile: infra/Dockerfile.processor
    container_name: climaxtreme-synthetic-generator
    profiles:
      - synthetic
    depends_on:
      - namenode
      - datanode1
      - kafka
    environment:
      - HADOOP_CONF_DIR=/etc/hadoop
      - SPARK_HOME=/usr/local/lib/python3.11/site-packages/pyspark
      - PYSPARK_PYTHON=/usr/bin/python3
      - PYSPARK_DRIVER_PYTHON=/usr/bin/python3
      - SPARK_EXECUTOR_MEMORY=2g
      - SPARK_DRIVER_MEMORY=2g
      - KAFKA_BOOTSTRAP_SERVERS=climaxtreme-kafka:9092
    volumes:
      - ../Tools:/app/Tools
      - ../DATA:/app/DATA
      - synthetic_data:/app/DATA/synthetic
    networks:
      - hdfs
    working_dir: /app/Tools
    command: >
      python3 -m climaxtreme.cli generate-synthetic
        --input-path /app/DATA/GlobalLandTemperaturesByCity.csv
        --output-path /app/DATA/synthetic
        --seed 42

  # ============================================================================
  # Kafka Streaming Worker (Dedicated consumer/processor for Kafka streams)
  # ============================================================================
  kafka-streaming-worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.processor
    container_name: climaxtreme-kafka-worker
    restart: unless-stopped
    profiles:
      - streaming
    depends_on:
      - kafka
      - namenode
    environment:
      - HADOOP_CONF_DIR=/etc/hadoop
      - SPARK_HOME=/usr/local/lib/python3.11/site-packages/pyspark
      - PYSPARK_PYTHON=/usr/bin/python3
      - PYSPARK_DRIVER_PYTHON=/usr/bin/python3
      - KAFKA_BOOTSTRAP_SERVERS=climaxtreme-kafka:9092
      - SPARK_EXECUTOR_MEMORY=1g
      - SPARK_DRIVER_MEMORY=1g
    volumes:
      - ../Tools:/app/Tools
      - ../DATA:/app/DATA
      - synthetic_data:/app/DATA/synthetic
    networks:
      - hdfs
    working_dir: /app/Tools
    command: tail -f /dev/null

volumes:
  hadoop_namenode:
  hadoop_datanode1:
  hadoop_datanode2:
  hadoop_datanode3:
  synthetic_data:
    driver: local
  zookeeper_data:
  zookeeper_log:
  kafka_data:

networks:
  hdfs:
    driver: bridge
